<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120c07">
<title>آب‌پاشی تیرگان · Tirgan Splash</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='38' fill='%23ffd89a'/><circle cx='42' cy='42' r='12' fill='%23fff3d6'/></svg>">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#0a0705}
  body{
    touch-action:none;
    -webkit-user-select:none;user-select:none;
    font-family:"Vazirmatn","Tahoma","Helvetica Neue",Arial,sans-serif;
    cursor:crosshair;
  }

  /* ---------- 背景 ---------- */
  .bg-blur{
    position:absolute;inset:-12%;z-index:0;
    background:url(assets/tower.jpg) center/cover no-repeat;
    filter:blur(46px) brightness(.30) saturate(.75);
  }
  .bg-main{
    position:absolute;inset:0;z-index:1;
    background:url(assets/tower.jpg) center 38%/cover no-repeat;
    animation:drift 46s ease-in-out infinite alternate;
    will-change:transform;
  }
  @keyframes drift{
    from{transform:scale(1.00) translateY(0)}
    to  {transform:scale(1.055) translateY(-1.2%)}
  }
  .vignette{
    position:absolute;inset:0;z-index:2;pointer-events:none;
    background:
      linear-gradient(to bottom,rgba(8,5,3,.72) 0%,rgba(8,5,3,.10) 22%,rgba(8,5,3,0) 42%,rgba(8,5,3,.12) 72%,rgba(8,5,3,.78) 100%),
      radial-gradient(ellipse at 50% 62%,rgba(255,180,90,.10) 0%,rgba(0,0,0,0) 58%);
  }
  .wet{
    position:absolute;left:0;right:0;bottom:0;height:24%;z-index:2;
    pointer-events:none;
    background:
      radial-gradient(ellipse 70% 40% at 50% 100%,rgba(170,215,235,.20) 0%,rgba(170,215,235,0) 72%),
      linear-gradient(to top,rgba(120,170,200,.13) 0%,rgba(120,170,190,0) 60%);
    -webkit-mask-image:linear-gradient(to top,#000 0%,rgba(0,0,0,.65) 46%,transparent 100%);
            mask-image:linear-gradient(to top,#000 0%,rgba(0,0,0,.65) 46%,transparent 100%);
  }

  /* ==========================================================
     人物骨架
     char-box ─ bob(呼吸) ─ rig(常驻摇摆) ─ act(动作) ─┬ body
                                                      └ headWrap(动作时的头) ─ head(常驻微摆)
     每层只管一种变换，互不覆盖。
     ========================================================== */
  .char-box{
    position:absolute;z-index:4;
    left:0;                       /* 水平定位全靠 transform，基点固定，避免各浏览器静态位置差异 */
    transform-origin:50% 100%;
    pointer-events:none;
    will-change:transform;
  }

  .bob{
    height:100%;
    transform-origin:50% 100%;
    animation:breathe 3.7s ease-in-out infinite;
  }
  #girlBox .bob{animation-duration:4.4s;animation-delay:-1.1s}

  .rig{
    position:relative;height:100%;display:flex;
    transform-origin:50% 100%;
    animation:swayA 5.3s ease-in-out infinite;
  }
  #girlBox .rig{animation-duration:6.1s;animation-delay:-2.3s}

  .act{
    position:relative;height:100%;display:flex;
    transform-origin:50% 100%;
  }

  .p{height:100%;width:auto;display:block;-webkit-user-drag:none}

  /* 身体：只露下半（脚 → 下巴以下） */
  .p.body{
    clip-path:inset(46.4% 0 0 0);
    -webkit-clip-path:inset(46.4% 0 0 0);
  }
  /* 头：只露上半，裁到 52% —— 正好落在脖子上（全图最窄处）。
     旋转轴放在 56%，裁剪线离轴只有 4%，转动 8 度时纵向位移不到半个像素，
     所以接缝不会裂；脖子本身又被立领挡住，看不出来。 */
  .headWrap{
    position:absolute;left:0;top:0;height:100%;
    transform-origin:50% 55.5%;
  }
  .p.head{
    clip-path:inset(0 0 48.2% 0);
    -webkit-clip-path:inset(0 0 48.2% 0);
    transform-origin:50% 55.5%;
    animation:swayH 6.4s ease-in-out infinite;
  }
  #girlBox .p.head{animation-duration:7.2s;animation-delay:-3.1s}

  /* 常驻：呼吸 / 摇摆 / 头部错拍 */
  @keyframes breathe{
    0%,100%{transform:translate(0,0) scale(1,1)}
    25%    {transform:translate(-.55%,-.5%) scale(.997,1.006)}
    50%    {transform:translate(0,-1.1%) scale(.995,1.009)}
    75%    {transform:translate(.55%,-.5%) scale(.997,1.006)}
  }
  @keyframes swayA{
    0%,100%{transform:rotate(-1.15deg)}
    50%    {transform:rotate(1.15deg)}
  }
  @keyframes swayH{
    0%,100%{transform:rotate(.85deg)}
    50%    {transform:rotate(-.85deg)}
  }

  /* ---------- 动作：走路 ---------- */
  .act.a-walk{animation:walkAct .64s ease-in-out infinite}
  @keyframes walkAct{
    0%  {transform:translateY(0)    rotate(-3.4deg) scale(1,1)}
    25% {transform:translateY(-5px) rotate(0deg)    scale(.997,1.012)}
    50% {transform:translateY(0)    rotate(3.4deg)  scale(1.004,.988)}
    75% {transform:translateY(-5px) rotate(0deg)    scale(.997,1.012)}
    100%{transform:translateY(0)    rotate(-3.4deg) scale(1,1)}
  }
  .headWrap.a-walk{animation:walkHead .64s ease-in-out infinite}
  @keyframes walkHead{
    0%,100%{transform:rotate(1.8deg) translateY(1px)}
    50%    {transform:rotate(-1.8deg) translateY(-2px)}
  }

  /* ---------- 动作：舀水（正面 Q 版的弯腰 = 深蹲压扁 + 头沉下去看盆，横向只微倾 6°，
     大角度侧倾会读成"摔倒"。rotate 正值 = 上身朝朝向方向(+x=面向水盆)微倾） ---------- */
  .act.a-scoop{animation:scoopAct 1.4s cubic-bezier(.4,.55,.35,1)}
  @keyframes scoopAct{
    0%  {transform:rotate(0)     translateY(0)     scale(1,1)}
    12% {transform:rotate(-3deg) translateY(-1.5%) scale(1.01,.995)}
    38% {transform:rotate(6deg)  translateY(0)     scale(1.07,.78)}
    52% {transform:rotate(7deg)  translateY(0)     scale(1.08,.75)}
    68% {transform:rotate(7deg)  translateY(0)     scale(1.08,.76)}
    84% {transform:rotate(-2deg) translateY(-1%)  scale(.99,1.02)}
    100%{transform:rotate(0)     translateY(0)     scale(1,1)}
  }
  .headWrap.a-scoop{animation:scoopHead 1.4s cubic-bezier(.4,.55,.35,1)}
  @keyframes scoopHead{
    0%  {transform:translateY(0)   rotate(0)}
    12% {transform:translateY(-1%) rotate(-3deg)}
    40% {transform:translateY(7%)  rotate(6deg)}
    60% {transform:translateY(8%)  rotate(7deg)}
    84% {transform:translateY(-1%) rotate(-2deg)}
    100%{transform:translateY(0)   rotate(0)}
  }

  /* ---------- 动作：泼水（后仰蓄力 → 前扑 → 回弹） ---------- */
  .act.a-lunge{animation:lungeAct .76s cubic-bezier(.3,.9,.35,1)}
  @keyframes lungeAct{
    0%  {transform:translateX(0)      rotate(0)       scale(1,1)}
    16% {transform:translateX(-7%)    rotate(-4deg)   scale(1.02,.975)}
    34% {transform:translateX(13%)    rotate(10deg)   scale(.95,1.055)}
    52% {transform:translateX(9%)     rotate(7deg)    scale(.975,1.02)}
    72% {transform:translateX(-2.5%)  rotate(-2.5deg) scale(1.012,.99)}
    100%{transform:translateX(0)      rotate(0)       scale(1,1)}
  }
  .headWrap.a-lunge{animation:lungeHead .76s cubic-bezier(.35,.9,.35,1)}
  @keyframes lungeHead{
    0%  {transform:rotate(0) translateX(0)}
    16% {transform:rotate(-2deg) translateX(-3%)}
    36% {transform:rotate(2.5deg) translateX(4%)}
    62% {transform:rotate(1.5deg) translateX(1.5%)}
    100%{transform:rotate(0) translateX(0)}
  }

  /* ---------- 动作：被泼到（后仰 + 缩，不是下沉） ---------- */
  .act.a-hit{animation:hitAct .52s cubic-bezier(.3,1.1,.4,1)}
  @keyframes hitAct{
    0%  {transform:translateX(0)     rotate(0)      scale(1,1)}
    14% {transform:translateX(-9%)   rotate(-7deg)  scale(.94,1.065)}
    36% {transform:translateX(-3%)   rotate(-3deg)  scale(1.02,.985)}
    58% {transform:translateX(1.5%)  rotate(2deg)   scale(.995,1.005)}
    100%{transform:translateX(0)     rotate(0)      scale(1,1)}
  }
  .headWrap.a-hit{animation:hitHead .52s cubic-bezier(.3,1.1,.4,1)}
  @keyframes hitHead{
    0%  {transform:rotate(0)}
    14% {transform:rotate(-5deg)}
    40% {transform:rotate(3.5deg)}
    65% {transform:rotate(-1.5deg)}
    100%{transform:rotate(0)}
  }

  /* ---------- 动作：甩水（泼水节的标志） ---------- */
  .act.a-shake{animation:shakeAct .8s ease-in-out}
  @keyframes shakeAct{
    0%,100%{transform:rotate(0) scale(1,1)}
    12% {transform:rotate(-4.5deg) scale(1.01,.99)}
    26% {transform:rotate(4.5deg)  scale(.99,1.01)}
    40% {transform:rotate(-3.6deg)}
    54% {transform:rotate(3.6deg)}
    68% {transform:rotate(-2.2deg)}
    82% {transform:rotate(2.2deg)}
  }
  .headWrap.a-shake{animation:shakeHead .8s ease-in-out}
  @keyframes shakeHead{
    0%,100%{transform:rotate(0) translateX(0)}
    10% {transform:rotate(-5.5deg) translateX(-2.5%)}
    24% {transform:rotate(5.5deg)  translateX(2.5%)}
    38% {transform:rotate(-4.2deg) translateX(-2%)}
    52% {transform:rotate(4.2deg)  translateX(2%)}
    68% {transform:rotate(-2.4deg) translateX(-1.2%)}
    84% {transform:rotate(2.4deg)  translateX(1.2%)}
  }

  /* ---------- 动作：笑（仰头颤） ---------- */
  .act.a-laugh{animation:laughAct .9s ease-in-out}
  @keyframes laughAct{
    0%,100%{transform:translateY(0) scale(1,1)}
    18% {transform:translateY(-3px) scale(1.015,.985)}
    36% {transform:translateY(0)    scale(.992,1.008)}
    54% {transform:translateY(-2px) scale(1.01,.99)}
    72% {transform:translateY(0)    scale(.996,1.004)}
  }
  .headWrap.a-laugh{animation:laughHead .9s ease-in-out}
  @keyframes laughHead{
    0%,100%{transform:rotate(-2deg)}
    25% {transform:rotate(-5deg)}
    50% {transform:rotate(-3deg)}
    75% {transform:rotate(-5deg)}
  }

  /* ---------- 动作：蹦一下（Q 版最出效果的一下） ---------- */
  .act.a-hop{animation:hopAct .52s cubic-bezier(.3,1.5,.5,1)}
  @keyframes hopAct{
    0%  {transform:translateY(0)     scale(1,1)}
    20% {transform:translateY(0)     scale(1.055,.935)}
    48% {transform:translateY(-10px) scale(.965,1.045)}
    74% {transform:translateY(0)     scale(1.05,.955)}
    100%{transform:translateY(0)     scale(1,1)}
  }
  .headWrap.a-hop{animation:hopHead .52s cubic-bezier(.3,1.5,.5,1)}
  @keyframes hopHead{
    0%  {transform:rotate(0)     translateY(0)}
    22% {transform:rotate(2deg)  translateY(2px)}
    50% {transform:rotate(-3deg) translateY(-3px)}
    76% {transform:rotate(1.5deg) translateY(1px)}
    100%{transform:rotate(0)     translateY(0)}
  }

  /* 远景角色：省一层动画，性能优先 */
  .char-box[data-far="1"] .bob{animation:none}

  /* 人群层：图缺失时降级用。压暗 + 降饱和 + 微模糊，
     远看就是广场上更远的另一个人，不会觉得是同一个角色重复。 */
  .char-box.crowd .p{ filter:brightness(.68) saturate(.72) blur(.7px); }
  .char-box.crowd{ opacity:.9 }

  .gshadow{
    position:absolute;left:50%;bottom:-1.5%;
    width:74%;height:7%;
    transform:translateX(-50%);
    background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,.62) 0%,rgba(0,0,0,.34) 42%,rgba(0,0,0,0) 74%);
    filter:blur(3px);
  }

  /* ---------- 陶土水盆 ---------- */
  .basin{
    position:absolute;z-index:2;pointer-events:none;
    transform:translateX(-50%);
    filter:drop-shadow(0 5px 9px rgba(0,0,0,.38));
  }

  /* ---------- 节日氛围：暖光 / 彩旗 / 湿身 ---------- */
  .glow{
    position:absolute;inset:0;z-index:2;pointer-events:none;
    background:
      radial-gradient(ellipse 62% 34% at 68% 16%, rgba(255,196,110,.17) 0%, rgba(255,196,110,0) 70%),
      radial-gradient(ellipse 48% 26% at 20% 12%, rgba(255,170,90,.11) 0%, rgba(255,170,90,0) 70%);
    animation:glowPulse 9s ease-in-out infinite alternate;
  }
  @keyframes glowPulse{from{opacity:.72}to{opacity:1}}

  .bunting{
    position:absolute;left:0;top:0;z-index:3;width:100%;height:auto;
    pointer-events:none;opacity:.94;
    filter:drop-shadow(0 3px 7px rgba(0,0,0,.45));
    transform-origin:50% 0;
    animation:buntSway 8.5s ease-in-out infinite;
  }
  .bunting.b2{top:13px;opacity:.8;animation-duration:10.5s;animation-delay:-3.4s}
  @keyframes buntSway{
    0%,100%{transform:rotate(-.5deg)}
    50%    {transform:rotate(.5deg)}
  }

  /* 湿身：挨了几瓢的人衣料暗一点、泛水光 */
  .char-box.soak{filter:saturate(.86) brightness(1.05)}

  /* ---------- 金线（箭） ---------- */
  .line-wrap{
    position:absolute;z-index:5;left:0;right:0;top:26%;
    height:120px;pointer-events:none;transform:rotate(-17deg);
  }
  .line{
    position:absolute;left:0;top:50%;height:2px;width:46%;
    background:linear-gradient(90deg,rgba(255,210,122,0),#ffd27a 35%,#fff8e2 50%,#ffd27a 65%,rgba(255,210,122,0));
    filter:blur(.5px) drop-shadow(0 0 7px rgba(255,205,120,.95));
    opacity:0;
  }
  .line.go{animation:fly 1.9s cubic-bezier(.4,0,.6,1)}
  @keyframes fly{
    0%  {opacity:0;transform:translateX(-90%) scaleX(.35)}
    12% {opacity:1}
    80% {opacity:1}
    100%{opacity:0;transform:translateX(240%) scaleX(1.15)}
  }

  /* ---------- HUD ---------- */
  .hud{
    position:absolute;z-index:8;left:0;right:0;
    top:calc(env(safe-area-inset-top,0px) + 18px);
    text-align:center;pointer-events:none;
    color:#f3e8d2;
    text-shadow:0 2px 14px rgba(0,0,0,.9);
  }
  .hud .fa{font-size:15px;letter-spacing:.5px;opacity:.95}
  .hud .num{
    display:inline-block;min-width:2ch;
    font-weight:700;color:#ffd89a;
    font-variant-numeric:tabular-nums;
  }
  .hud .en{
    margin-top:6px;font-size:10px;letter-spacing:2.4px;
    text-transform:uppercase;opacity:.5;
  }
  .hud a.en{
    pointer-events:auto;color:inherit;text-decoration:none;cursor:pointer;
    transition:opacity .35s,color .35s;
    display:inline-block;padding:4px 10px;margin:-4px -10px;
  }
  .hud a.en:hover{opacity:.95;color:#ffd89a;text-shadow:0 0 12px rgba(255,216,154,.6)}

  .hint{
    position:absolute;z-index:8;left:0;right:0;
    bottom:calc(env(safe-area-inset-bottom,0px) + 26px);
    text-align:center;pointer-events:none;
    color:#f3e8d2;font-size:14px;letter-spacing:.5px;
    text-shadow:0 2px 12px rgba(0,0,0,.9);
    opacity:.85;transition:opacity .8s;
  }
  .hint b{color:#ffd89a;font-weight:600}
  .hint.gone{opacity:0}

  #fx{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:6;pointer-events:none}

  /* ---------- 启动遮罩 ---------- */
  #gate{
    position:absolute;inset:0;z-index:20;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(8,5,3,.86);backdrop-filter:blur(6px);
    color:#f3e8d2;text-align:center;padding:0 28px;
    transition:opacity .7s;cursor:pointer;
  }
  #gate.hide{opacity:0;pointer-events:none}
  #gate .big{font-size:22px;color:#ffd89a;margin-bottom:10px;letter-spacing:1px}
  #gate .sub{font-size:12px;opacity:.6;letter-spacing:2px;text-transform:uppercase;margin-top:14px}
  #gate .dot{
    width:14px;height:14px;border-radius:50%;background:#ffd89a;margin-top:26px;
    animation:pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.7);opacity:1}}

  /* ---------- 横屏 / 桌面 ---------- */
  @media (min-aspect-ratio: 1/1){
    .bg-main{background-size:contain;background-position:center 42%;background-repeat:no-repeat}
    .hud{top:calc(env(safe-area-inset-top,0px) + 22px)}
    .hud .fa{font-size:17px}
    .hint{bottom:calc(env(safe-area-inset-bottom,0px) + 30px)}
    .line-wrap{top:22%}
  }
  @media (prefers-reduced-motion: reduce){
    .bob,.rig,.p.head,.act,.headWrap{animation:none !important}
  }
</style>
</head>
<body>

<div class="bg-blur"></div>
<div class="bg-main"></div>
<div class="vignette"></div>
<div class="wet"></div>
<div class="glow"></div>

<div class="line-wrap"><div class="line" id="line"></div></div>

<canvas id="fx"></canvas>

<div class="hud">
  <div class="fa">امروز <span class="num" id="cnt">۱۲٬۸۴۷</span> نفر آب پاشیدند</div>
  <a class="en" href="https://www.patreon.com/c/rastfilm" target="_blank" rel="noopener" title="Rast Film on Patreon">Tirgan Splash · Rast Film</a>
</div>

<div class="hint" id="hint"><b>با انگشت بکش</b> — 用手指划过屏幕</div>

<div id="gate">
  <div class="big">آب‌پاشی</div>
  <div style="font-size:13px;opacity:.75;line-height:1.9">
    تیرگان مبارک<br>
    <span style="font-size:11px;opacity:.6">提尔甘节快乐</span>
  </div>
  <div class="dot"></div>
  <div class="sub">Tap to begin</div>
</div>

<script>
(function(){
  'use strict';

  /* ================= 配置 ================= */
  const CONFIG = {
    PATREON_URL: 'https://www.patreon.com/c/rastfilm'
  };

  /* ================= 画布 ================= */
  const cv  = document.getElementById('fx');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth;
    H = cv.clientHeight;
    cv.width  = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (CHARS.length){
      layoutChars();
      for (const c of CHARS){ c.w = 0; placeChar(c); }   // 清掉宽度缓存，按新窗口重测
    }
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 250));

  /* ================= 音效池 ================= */
  const NAMES = ['ab_m','ab_f','bezan_m','bezan_f','ey_m','ey_f','tirgan_m','tirgan_f','laugh_a','laugh_b','laugh_c'];
  const POOL = {};
  NAMES.forEach(n => {
    POOL[n] = [];
    for (let i = 0; i < 3; i++){
      const a = new Audio('assets/' + n + '.mp3');
      a.preload = 'auto';
      POOL[n].push(a);
    }
  });
  const _idx = {};
  function sfx(name, vol){
    const arr = POOL[name];
    if (!arr) return;
    _idx[name] = ((_idx[name] || 0) + 1) % arr.length;
    const a = arr[_idx[name]];
    try{ a.currentTime = 0; a.volume = vol == null ? 1 : vol; a.play().catch(()=>{}); }catch(e){}
  }
  // 环境层：轻声群笑（随机间隔 + 随机语速）
  const amb = new Audio('assets/laugh_d.mp3');
  amb.volume = 0.14; amb.preload = 'auto';
  function ambOnce(){
    if (!started || document.hidden){ scheduleAmb(); return; }
    try{
      amb.currentTime = 0;
      amb.playbackRate = 0.92 + Math.random() * 0.18;
      amb.play().catch(()=>{});
    }catch(e){}
    scheduleAmb();
  }
  function scheduleAmb(){ setTimeout(ambOnce, 9000 + Math.random() * 14000); }

  /* ================= 粒子 ================= */
  const drops = [];   // 空中的水珠
  const beads = [];   // 贴在屏幕上的水珠
  const trail = [];   // 划动的水痕
  const puffs = [];   // 水团（泼出去的那一片）
  const petals = [];  // 飘落的玫瑰花瓣（提尔甘的节庆元素）
  const sparks = [];  // 金色亮片（泼得狠时的火星）

  const MAX_DROPS = 460;
  const MAX_BEADS = 120;
  const GRAV = 0.20;

  function spawnSplash(x, y, dirX, dirY, power){
    const n = Math.round(14 + power * 30);
    for (let i = 0; i < n && drops.length < MAX_DROPS; i++){
      const spread = (Math.random() - 0.5) * 1.5;
      const base = Math.atan2(dirY, dirX) + spread;
      const sp = (1.4 + Math.random() * 3.2) * (0.55 + power);
      drops.push({
        x: x, y: y,
        vx: Math.cos(base) * sp,
        vy: Math.sin(base) * sp - (0.9 + Math.random() * 1.4),
        r: 1.4 + Math.random() * 3.6,
        life: 1,
        decay: 0.010 + Math.random() * 0.020
      });
    }
    const nb = Math.round(1 + power * 4);
    for (let i = 0; i < nb && beads.length < MAX_BEADS; i++){
      beads.push({
        x: x + (Math.random()-0.5) * 140,
        y: y + (Math.random()-0.5) * 140,
        r: 2 + Math.random() * 5.5,
        vy: 0,
        slide: Math.random() < 0.30,
        life: 1,
        decay: 0.0025 + Math.random() * 0.004
      });
    }
    // 泼得狠：撒一把金色亮片 —— 节日的火星
    if (power > 0.75){
      for (let i = 0; i < 5 && sparks.length < 26; i++){
        sparks.push({
          x: x + (Math.random()-0.5) * 56, y: y + (Math.random()-0.5) * 56,
          vy: -0.4 - Math.random() * 0.9,
          r: 0.8 + Math.random() * 1.5,
          life: 1, decay: 0.018 + Math.random() * 0.02
        });
      }
    }
  }

  /* 玫瑰花瓣：缓慢飘落，带横向摆动（提尔甘节要撒玫瑰水/花瓣） */
  const PETAL_COLORS = ['rgba(244,183,197,','rgba(232,168,180,','rgba(240,214,170,','rgba(226,140,150,'];
  function spawnPetals(n){
    for (let i = 0; i < n && petals.length < 20; i++){
      petals.push({
        x: Math.random() * W, y: -14 - Math.random() * H * 0.5,
        vy: 0.34 + Math.random() * 0.5,
        ph: Math.random() * 6.28, sw: 0.35 + Math.random() * 0.75,
        rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.02,
        w: 5 + Math.random() * 6, h: 3.2 + Math.random() * 3.4,
        hue: Math.floor(Math.random() * 4)
      });
    }
  }

  /* 舀水：蹲到盆边时，一大捧水从盆里升起来，向角色手心飘 */
  function spawnScoop(x, y, c){
    for (let i = 0; i < 14 && drops.length < MAX_DROPS; i++){
      drops.push({
        x: x + (Math.random()-0.5) * 26, y: y + (Math.random()-0.5) * 8,
        vx: -(c.dir || 1) * (0.4 + Math.random() * 1.1),
        vy: -1.7 - Math.random() * 2.0,
        r: 1.3 + Math.random() * 3.0,
        life: .95, decay: 0.014 + Math.random() * 0.012
      });
    }
    if (puffs.length < 64){
      puffs.push({ x: x, y: y - 6, vx: -(c.dir || 1) * 0.7, vy: -1.5,
                   r: 9 + Math.random()*4, life: 1, decay: 0.02 });
    }
    spawnSplash(x, y, 0, -1, 0.3);
  }

  // 落地溅起：水珠砸到地面，向上弹几点
  function groundY(){ return H * 0.905; }
  function bounce(p){
    const gy = groundY();
    const n = 2 + Math.round(Math.random() * 2);
    for (let i = 0; i < n && drops.length < MAX_DROPS; i++){
      drops.push({
        x: p.x + (Math.random()-0.5) * 10,
        y: gy,
        vx: (Math.random()-0.5) * 2.2,
        vy: -1.2 - Math.random() * 1.8,
        r: 1 + Math.random() * 1.8,
        life: .75,
        decay: 0.028 + Math.random() * 0.02
      });
    }
  }

  // 抛物线水弧：从 A 飞到 B，带一片水团
  function spawnArc(x, y, tx, ty, count){
    const T = 34 + Math.random()*12;
    const vx = (tx - x)/T, vy = (ty - y)/T - 0.5*GRAV*T;
    const n = Math.round(count*(0.7 + Math.random()*0.6));
    for (let i = 0; i < n && drops.length < MAX_DROPS; i++){
      drops.push({
        x: x + (Math.random()-0.5)*22, y: y + (Math.random()-0.5)*22,
        vx: vx + (Math.random()-0.5)*2.4, vy: vy + (Math.random()-0.5)*1.6,
        r: 1.6 + Math.random()*3.4,
        life: 1, decay: 0.008 + Math.random()*0.014
      });
    }
    // 水团：3 个大块，先整片飞出去，再散
    if (puffs.length > 64) puffs.splice(0, puffs.length - 64);
    for (let i = 0; i < 3; i++){
      puffs.push({
        x: x + (Math.random()-0.5)*14,
        y: y + (Math.random()-0.5)*14,
        vx: vx + (Math.random()-0.5)*1.2,
        vy: vy + (Math.random()-0.5)*0.8,
        r: 7 + Math.random()*7,
        life: 1,
        decay: 0.016 + Math.random()*0.012
      });
    }
    return T;
  }

  function update(dt){
    updateChars(dt);

    for (let i = drops.length - 1; i >= 0; i--){
      const p = drops[i];
      p.vy += GRAV;
      p.vx *= 0.982;
      p.vy *= 0.992;
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;
      // 落地溅起（只有中等以上的水滴才溅）
      if (p.vy > 0 && p.y > groundY() && p.r > 2 && p.life > 0.35){
        bounce(p);
        p.life = 0;
      }
      if (p.life <= 0 || p.y > H + 40 || p.x < -60 || p.x > W + 60){
        drops.splice(i, 1);
      }
    }

    for (let i = puffs.length - 1; i >= 0; i--){
      const f = puffs[i];
      f.vy += GRAV * 0.55;
      f.vx *= 0.975;
      f.x += f.vx;
      f.y += f.vy;
      f.r += 0.22;
      f.life -= f.decay;
      if (f.life <= 0) puffs.splice(i, 1);
    }

    for (let i = beads.length - 1; i >= 0; i--){
      const b = beads[i];
      if (b.slide){ b.vy += 0.014; b.y += b.vy; }
      b.life -= b.decay;
      if (b.life <= 0 || b.y > H + 30) beads.splice(i, 1);
    }

    for (let i = trail.length - 1; i >= 0; i--){
      trail[i].life -= 0.055;
      if (trail[i].life <= 0) trail.splice(i, 1);
    }

    for (let i = petals.length - 1; i >= 0; i--){
      const p = petals[i];
      p.ph += 0.02;
      p.x += Math.sin(p.ph) * p.sw;
      p.y += p.vy;
      p.rot += p.vr;
      if (p.y > H + 16){          // 落出屏幕就回到顶部循环飘
        p.y = -14;
        p.x = Math.random() * W;
      }
    }

    for (let i = sparks.length - 1; i >= 0; i--){
      const s = sparks[i];
      s.y += s.vy;
      s.life -= s.decay;
      if (s.life <= 0) sparks.splice(i, 1);
    }
  }

  function draw(){
    ctx.clearRect(0, 0, W, H);
    ctx.lineCap = 'round';

    // 花瓣（在水花后面飘）
    for (const p of petals){
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot + Math.sin(p.ph) * 0.6);
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = PETAL_COLORS[p.hue] + '0.8)';
      ctx.beginPath();
      ctx.ellipse(0, 0, p.w * 0.5, p.h * 0.5, 0, 0, 6.2832);
      ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    // 水痕
    for (const t of trail){
      ctx.globalAlpha = t.life * 0.30;
      ctx.strokeStyle = 'rgba(198,238,255,1)';
      ctx.lineWidth = t.w * t.life;
      ctx.beginPath();
      ctx.moveTo(t.x1, t.y1);
      ctx.lineTo(t.x2, t.y2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // 屏幕水珠
    for (const b of beads){
      const a = Math.max(0, Math.min(1, b.life));
      if (b.slide && b.vy > 0.25){
        const len = Math.min(b.vy * 16, 90);
        ctx.globalAlpha = a * 0.10;
        ctx.fillStyle = 'rgba(205,240,255,1)';
        ctx.fillRect(b.x - b.r * 0.36, b.y - len, b.r * 0.72, len);
      }
      ctx.globalAlpha = a * 0.26;
      ctx.fillStyle = 'rgba(190,232,255,1)';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = a * 0.80;
      ctx.fillStyle = 'rgba(255,255,255,1)';
      ctx.beginPath(); ctx.arc(b.x - b.r*0.30, b.y - b.r*0.32, b.r*0.30, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = a * 0.20;
      ctx.strokeStyle = 'rgba(255,255,255,1)';
      ctx.lineWidth = 0.7;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r*0.94, 0, 6.2832); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // 水团（泼出去的那一片）
    for (const f of puffs){
      const a = Math.max(0, f.life);
      const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
      g.addColorStop(0,   'rgba(226,248,255,' + (a*0.50) + ')');
      g.addColorStop(0.55,'rgba(190,232,255,' + (a*0.30) + ')');
      g.addColorStop(1,   'rgba(160,215,245,0)');
      ctx.globalAlpha = 1;
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.2832); ctx.fill();
    }

    // 空中水珠
    for (const p of drops){
      const a = Math.max(0, p.life);
      ctx.globalAlpha = a * 0.45;
      ctx.strokeStyle = 'rgba(190,232,255,1)';
      ctx.lineWidth = Math.max(0.6, p.r * 0.85);
      ctx.beginPath();
      ctx.moveTo(p.x - p.vx * 1.7, p.y - p.vy * 1.7);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      ctx.globalAlpha = a * 0.92;
      ctx.fillStyle = 'rgba(222,246,255,1)';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = a * 0.55;
      ctx.fillStyle = 'rgba(255,255,255,1)';
      ctx.beginPath(); ctx.arc(p.x - p.r*0.3, p.y - p.r*0.3, p.r*0.4, 0, 6.2832); ctx.fill();
    }

    // 金色亮片
    for (const s of sparks){
      const a = Math.max(0, s.life);
      ctx.globalAlpha = a * 0.35;
      ctx.fillStyle = 'rgba(255,236,190,1)';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 1.9, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = a * 0.9;
      ctx.fillStyle = 'rgba(255,214,140,1)';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  let last = performance.now();
  function loop(now){
    const dt = Math.min(50, now - last);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  /* ================= 计数 ================= */
  const FA = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
  function faNum(n){
    return String(n).replace(/\d/g, d => FA[+d]).replace(/\B(?=(\d{3})+(?!\d))/g, '٬');
  }
  const elCnt = document.getElementById('cnt');
  let count = 12847;
  try{
    const saved = localStorage.getItem('tirgan_count');
    if (saved) count = parseInt(saved, 10) || count;
  }catch(e){}
  elCnt.textContent = faNum(count);

  let countDirty = false;
  function bump(){
    count++;
    countDirty = true;
    elCnt.textContent = faNum(count);
  }
  setInterval(() => {
    if (countDirty){
      try{ localStorage.setItem('tirgan_count', String(count)); }catch(e){}
      countDirty = false;
    }
  }, 2000);

  /* ================= 交互 ================= */
  const hint = document.getElementById('hint');
  const lineEl = document.getElementById('line');

  let drawing = false;
  let px = 0, py = 0, pt = 0;
  let lastSfx = 0, lastHitSfx = 0, started = false;

  function hitTest(x, y){
    for (const c of CHARS){
      if (c.box.style.display === 'none') continue;
      const r = c.img.getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return c;
    }
    return null;
  }

  function onDown(x, y){
    if (!started) start();
    drawing = true;
    px = x; py = y; pt = performance.now();
    spawnSplash(x, y, (Math.random()-0.5), -1, 0.55);
    bump();
    const now = performance.now();
    if (now - lastSfx > 150){
      sfx(Math.random() < 0.5 ? 'ab_m' : 'ab_f', 0.85);
      lastSfx = now;
    }
    const c = hitTest(x, y);
    if (c) react(c, 0.9, {x: x, y: y});
  }

  function onMove(x, y){
    if (!drawing) return;
    const now = performance.now();
    const dt = Math.max(8, now - pt);
    const dx = x - px, dy = y - py;
    const dist = Math.hypot(dx, dy);
    if (dist < 3) return;

    const speed = dist / dt * 16;
    const power = Math.min(1.6, speed / 14 + 0.25);
    const nx = dx / dist, ny = dy / dist;

    trail.push({ x1: px, y1: py, x2: x, y2: y, w: 4 + power * 14, life: 1 });
    spawnSplash(x, y, nx, ny, power);
    bump();

    if (now - lastSfx > 165){
      const r = Math.random();
      if (r < 0.45)      sfx(Math.random() < 0.5 ? 'ab_m' : 'ab_f', 0.75);
      else if (r < 0.85) sfx(Math.random() < 0.5 ? 'bezan_m' : 'bezan_f', 0.70);
      else               sfx('laugh_c', 0.55);
      lastSfx = now;
    }

    const c = hitTest(x, y);
    if (c) react(c, 0.9, {x: x, y: y});

    px = x; py = y; pt = now;
  }

  /* 被泼到：缩 → 甩水 → 有时还手（NPC 或玩家） */
  function react(c, gain, fromPlayer){
    const now = performance.now();
    // 同一个角色 260ms 内不重复触发（避免连点抖动）
    if (now - (c.lastHit || 0) < 260) return;
    c.lastHit = now;

    // 动作一定播；声音做全局节流，避免多角色同时被泼时糊成一片
    const canSfx = (now - lastHitSfx) > 420;
    if (canSfx) lastHitSfx = now;

    play(c, 'hit', 520);
    // 四成概率甩水 —— 泼水节最有辨识度的动作
    if (Math.random() < 0.42) setTimeout(() => play(c, 'shake', 800), 240);

    if (canSfx){
      const v = (c.def.sex === 'f') ? 'f' : 'm';
      const r = Math.random() * (gain || 1);
      if (r < 0.34)      sfx('ey_' + v, 0.95);
      else if (r < 0.66) sfx('tirgan_' + v, 0.90);
      else if (r < 0.88) sfx(Math.random() < 0.5 ? 'laugh_a' : 'laugh_b', 0.72);
      else               sfx('laugh_c', 0.80);
    }

    // 玩家泼我 → 四成概率朝着玩家的手指泼回去（和玩家真正打起来）
    if (fromPlayer && c.state === 'idle' && started && Math.random() < 0.4){
      const pt = fromPlayer;
      setTimeout(() => {
        if (!started || c.state !== 'idle') return;
        const from = centerOf(c.box, 0.36);
        c.dir = pt.x >= c.x ? 1 : -1;
        moveChar(c);
        play(c, 'lunge', 760);
        setTimeout(() => {
          if (!started) return;
          spawnArc(from.x, from.y, pt.x, pt.y, 26);
          const n2 = performance.now();
          if (n2 - lastNpcSfx > 2400){
            sfx(Math.random() < 0.5 ? 'bezan_m' : 'bezan_f', 0.6);
            lastNpcSfx = n2;
          }
        }, 180);
      }, 320 + Math.random() * 280);
      return;
    }
    // 被泼急了会跑去舀水再泼回去 —— 广场才会"打起来"（决斗中不许开溜）
    if (c.state === 'idle' && started && !c.duelLock && Math.random() < 0.22){
      c.basin = nearestBasin(c);
      const br = c.basin.getBoundingClientRect();
      const bx = br.left + br.width/2;
      const side = c.x <= bx ? -1 : 1;
      c.state = 'toBasin';
      c.targetX = clampX(bx + side*(br.width*0.5 + c.box.offsetWidth*0.12), c);
    }
  }

  function onUp(){ drawing = false; }

  cv.style.pointerEvents = 'none';
  document.addEventListener('pointerdown', e => {
    if (e.target.closest('#gate')) return;
    if (e.target.closest('a')) return;
    onDown(e.clientX, e.clientY);
  }, {passive:true});
  document.addEventListener('pointermove', e => {
    onMove(e.clientX, e.clientY);
  }, {passive:true});
  document.addEventListener('pointerup', onUp, {passive:true});
  document.addEventListener('pointercancel', onUp, {passive:true});

  /* ================= 启动 ================= */
  const gate = document.getElementById('gate');
  function start(){
    if (started) return;
    started = true;
    gate.classList.add('hide');
    setTimeout(() => { if (gate.parentNode) gate.remove(); }, 800);
    NAMES.forEach(n => POOL[n].forEach(a => {
      try{ a.play().then(() => { a.pause(); a.currentTime = 0; }).catch(()=>{}); }catch(e){}
    }));
    scheduleAmb();
    spawnPetals(14);
    setTimeout(() => hint.classList.add('gone'), 6000);
  }
  // 花瓣循环补货
  setInterval(() => { if (started && !document.hidden && petals.length < 14) spawnPetals(3); }, 4000);
  gate.addEventListener('pointerdown', e => { e.stopPropagation(); start(); });
  gate.addEventListener('click', () => start());

  /* ================= 金线 ================= */
  function shoot(){
    lineEl.classList.remove('go');
    void lineEl.offsetWidth;
    lineEl.classList.add('go');
  }
  function scheduleLine(){
    const wait = 17000 + Math.random() * 13000;
    setTimeout(() => { shoot(); scheduleLine(); }, wait);
  }

  /* ================= 广场：水盆 ================= */
  const svgBasin = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 84">'
    + '<path d="M16 36 L26 72 Q70 83 114 72 L124 36 Z" fill="#7a4a2e"/>'
    + '<ellipse cx="70" cy="36" rx="54" ry="16" fill="#935c39"/>'
    + '<ellipse cx="70" cy="34" rx="45" ry="11.5" fill="#2e6484"/>'
    + '<ellipse cx="70" cy="33" rx="45" ry="11.5" fill="#4d8fb2" opacity=".5"/>'
    + '<ellipse cx="57" cy="31" rx="15" ry="3.6" fill="#bfe3f5" opacity=".55"/>'
    + '</svg>';
  const BASINS = [];
  [[0.215, 0.032], [0.755, 0.085], [0.470, 0.022]].forEach(pr => {
    const d = document.createElement('div');
    d.className = 'basin';
    d.innerHTML = svgBasin;
    d.style.left = (pr[0]*100) + '%';
    d.style.bottom = pr[1] + '%';
    d.style.width = 'clamp(62px, 8.5vw, 128px)';
    document.body.appendChild(d);
    BASINS.push(d);
  });

  /* ================= 节日装饰：彩旗（两条垂弧三角旗） ================= */
  (function buildBunting(){
    const NS = 'http://www.w3.org/2000/svg';
    const mk = (y1, sag, colors, cls) => {
      const svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('viewBox', '0 0 1000 96');
      svg.setAttribute('preserveAspectRatio', 'none');
      svg.classList.add('bunting');
      if (cls) svg.classList.add(cls);
      const path = document.createElementNS(NS, 'path');
      path.setAttribute('d', 'M0 ' + y1 + ' Q 500 ' + (y1 + sag) + ' 1000 ' + y1);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', 'rgba(64,40,24,.8)');
      path.setAttribute('stroke-width', '2.5');
      path.setAttribute('vector-effect', 'non-scaling-stroke');
      svg.appendChild(path);
      const n = 15;
      for (let i = 0; i < n; i++){
        const t = (i + 0.5) / n;
        const px = t * 1000;
        const py = y1 + 2 * t * (1 - t) * sag;           // 二次贝塞尔上的 y
        const tri = document.createElementNS(NS, 'path');
        tri.setAttribute('d', 'M' + (px-13) + ' ' + py + ' L' + (px+13) + ' ' + py + ' L' + px + ' ' + (py+33) + ' Z');
        tri.setAttribute('fill', colors[i % colors.length]);
        tri.setAttribute('opacity', '.92');
        svg.appendChild(tri);
      }
      document.body.appendChild(svg);
    };
    mk(4, 30, ['#c05a40','#e0a33a','#3f8ea8','#e8dcc4','#4e9e6f']);
    mk(8, 42, ['#e0a33a','#b0563f','#e8dcc4','#3f8ea8','#c05a40'], 'b2');
  })();
  function basinX(b){ const r = b.getBoundingClientRect(); return r.left + r.width/2; }
  function nearestBasin(c){
    let best = BASINS[0], bd = 1e9;
    for (const b of BASINS){
      const d = Math.abs(basinX(b) - c.x);
      if (d < bd){ bd = d; best = b; }
    }
    return best;
  }

  /* ================= 角色 ================= */
  // fallback：图还没做出来时，用已有角色 + 人群滤镜顶上，页面不会出现破图
  const CHAR_DEFS = [
    {src:'assets/boy.png',   fx:0.10, bt:5,  vh:40, sex:'m'},
    {src:'assets/girl.png',  fx:0.89, bt:13, vh:28, sex:'f'},
    {src:'assets/boy2.png',  fx:0.34, bt:14, vh:25, sex:'m', fallback:'assets/boy.png'},
    {src:'assets/girl2.png', fx:0.63, bt:15, vh:23, sex:'f', fallback:'assets/girl.png'},
    {src:'assets/boy3.png',  fx:0.50, bt:21, vh:18, sex:'m', fallback:'assets/boy.png'},
    {src:'assets/girl3.png', fx:0.44, bt:20, vh:19, sex:'f', fallback:'assets/girl.png'}
  ];
  const CHARS = [];

  function buildChar(def, i){
    const box = document.createElement('div');
    box.className = 'char-box';
    if (def.vh < 26) box.dataset.far = '1';
    box.innerHTML =
      '<i class="gshadow"></i>' +
      '<div class="bob"><div class="rig"><div class="act">' +
        '<img class="p body" alt="">' +
        '<div class="headWrap"><img class="p head" alt=""></div>' +
      '</div></div></div>';
    document.body.appendChild(box);

    const body = box.querySelector('.p.body');
    const head = box.querySelector('.p.head');
    const act  = box.querySelector('.act');
    const headWrap = box.querySelector('.headWrap');

    body.src = def.src;
    head.src = def.src;
    // 图缺失 → 有 fallback 就降级成远景人群，没有才隐藏（绝不留破图）
    let degraded = false;
    function onErr(){
      if (degraded) { box.style.display = 'none'; return; }
      if (def.fallback){
        degraded = true;
        body.src = def.fallback;
        head.src = def.fallback;
        box.classList.add('crowd');
      } else {
        box.style.display = 'none';
      }
    }
    body.addEventListener('error', onErr);
    head.addEventListener('error', onErr);

    box.style.bottom = def.bt + '%';
    box.style.zIndex = Math.max(3, Math.round(5.5 - def.bt/4));

    // 每个角色的呼吸 / 摇摆周期都不同 —— 广场上才不会像复制粘贴
    const bob = box.querySelector('.bob');
    const rig = box.querySelector('.rig');
    bob.style.animationDuration = (3.15 + Math.random()*1.6).toFixed(2) + 's';
    bob.style.animationDelay    = (-Math.random()*4).toFixed(2) + 's';
    rig.style.animationDuration = (4.5 + Math.random()*2.8).toFixed(2) + 's';
    rig.style.animationDelay    = (-Math.random()*6).toFixed(2) + 's';
    head.style.animationDuration = (5.3 + Math.random()*3.2).toFixed(2) + 's';
    head.style.animationDelay    = (-Math.random()*7).toFixed(2) + 's';

    return {box, img: body, body, head, act, headWrap, def, w:0,
            x:0, u:def.fx, dir: Math.random() < 0.5 ? -1 : 1,
            speed: 34 + Math.random()*42, state:'idle',
            until: performance.now() + 1400 + Math.random()*2800,
            targetX: 0, tmr: 0, actName: '',
            wet: 0, nextAtk: 0, duelFoe: null, soakTmr: 0, duelLock: false};
  }

  CHAR_DEFS.forEach((def, i) => {
    const c = buildChar(def, i);
    CHARS.push(c);
    c.body.addEventListener('load', () => placeChar(c));
    if (c.body.complete && c.body.naturalWidth) placeChar(c);
  });

  /* 位置只写 transform（不改 left），避免每帧强制同步布局 */
  function moveChar(c){
    if (!c.w) c.w = c.box.offsetWidth || 0;
    c.box.style.transform = 'translateX(' + (c.x - c.w*0.5) + 'px) scaleX(' + (c.dir < 0 ? -1 : 1) + ')';
  }

  /* 按比例放好一个角色的水平位置（只夹边界；陶盆在脚边，重叠是正常的场景） */
  function placeChar(c){
    if (c.box.style.display === 'none') return;
    if (!c.w) c.w = c.box.offsetWidth || 0;
    c.x = clampX(c.u * innerWidth, c);
    moveChar(c);
  }

  /* 播一个动作：act 与 headWrap 同步，时长到点自动清 */
  function play(c, name, ms){
    if (!c.act) return;
    c.actName = name;
    c.act.className = 'act a-' + name;
    c.headWrap.className = 'headWrap a-' + name;
    clearTimeout(c.tmr);
    c.tmr = setTimeout(() => {
      if (c.actName !== name) return;
      c.act.className = 'act';
      c.headWrap.className = 'headWrap';
      c.actName = '';
    }, ms);
  }
  function stopAct(c){
    c.actName = '';
    clearTimeout(c.tmr);
    c.act.className = 'act';
    c.headWrap.className = 'headWrap';
  }

  function layoutChars(){
    const k = (innerWidth / innerHeight > 1) ? 1.66 : 1;
    for (const c of CHARS) c.box.style.height = (c.def.vh * k) + 'vh';
  }
  function clampX(px, c){
    const half = (c.w || c.box.offsetWidth) * 0.5 + 8;
    return Math.max(half, Math.min(innerWidth - half, px));
  }
  function centerOf(el, ry){
    const r = el.getBoundingClientRect();
    return { x: r.left + r.width/2, y: r.top + r.height*(ry || 0.30) };
  }
  function nudgeOffBasin(x, c){
    for (const b of BASINS){
      const r = b.getBoundingClientRect();
      const cx = r.left + r.width/2;
      const half = r.width*0.5 + (c.w || c.box.offsetWidth)*0.10;
      if (Math.abs(x - cx) < half){
        x = x < cx ? cx - half : cx + half;
      }
    }
    return clampX(x, c);
  }

  let lastNpcSfx = 0, lastNpcAtk = 0;

  function updateChars(dtms){
    const dt = Math.min(64, dtms)/1000;
    for (const c of CHARS){
      if (c.box.style.display === 'none') continue;
      if (c.state === 'walk' || c.state === 'toBasin'){
        const d = c.targetX - c.x;
        const step = c.speed * dt;
        if (Math.abs(d) <= step){
          c.x = c.targetX;
          arriveChar(c);
        } else {
          c.dir = d > 0 ? 1 : -1;
          c.x += c.dir * step;
          if (c.actName !== 'walk') play(c, 'walk', 100000);
        }
        c.u = c.x / innerWidth;
        moveChar(c);
      }
    }
  }

  function arriveChar(c){
    stopAct(c);
    if (c.state === 'toBasin'){
      c.state = 'scoop';
      const bx = basinX(c.basin);
      c.dir = bx >= c.x ? 1 : -1;
      moveChar(c);                              // 立刻转身面向水盆
      play(c, 'scoop', 1400);
      setTimeout(() => {                        // 蹲到盆边：一捧水升起来
        if (!started || !c.basin || !c.basin.isConnected) return;
        const r = c.basin.getBoundingClientRect();
        spawnScoop(r.left + r.width/2, r.top + r.height*0.30, c);
      }, 640);
      setTimeout(() => {
        throwWater(c);
        c.state = 'idle';
        c.until = performance.now() + 1500 + Math.random()*2600;
      }, 1150);
    } else {
      c.state = 'idle';
      const foe = c.duelFoe; c.duelFoe = null;
      if (foe && foe.box.style.display !== 'none'){
        // 走到对方面前：转身对峙，多回合对攻
        c.dir = foe.x >= c.x ? 1 : -1;
        moveChar(c);
        if (foe.state === 'idle'){
          foe.dir = c.x >= foe.x ? 1 : -1;
          moveChar(foe);
        }
        c.until = performance.now() + 400;
        setTimeout(() => { if (started && c.state === 'idle') exchange(c, foe, 0); }, 460);
        // 拉一个看客：走到旁边观战，一会儿大笑
        const onl = CHARS.find(o => o !== c && o !== foe && o.box.style.display !== 'none'
          && o.state === 'idle' && Math.abs(o.x - c.x) < innerWidth * 0.5);
        if (onl){
          onl.state = 'walk';
          onl.targetX = nudgeOffBasin(clampX((c.x + foe.x)/2 + (Math.random() < 0.5 ? -1 : 1) * innerWidth * 0.09, onl), onl);
          onl.until = performance.now() + 3600;
          setTimeout(() => {
            if (started && onl.state === 'idle'){
              play(onl, 'laugh', 950);
              onl.until = performance.now() + 1500;
            }
          }, 2800);
        }
      } else {
        c.until = performance.now() + 1100 + Math.random()*2300;
        const nx = nudgeOffBasin(c.x, c);
        if (Math.abs(nx - c.x) > 1){ c.x = nx; moveChar(c); }
      }
    }
  }

  function throwWater(c, chain, aimAt){
    const from = centerOf(c.box, 0.36);
    let tx, ty, target = aimAt || null;
    if (!target && Math.random() < 0.75){
      // 找一个"够得着"的人泼：太远的不泼，别像隔空扔水
      const pool = CHARS.filter(o => o !== c && o.box.style.display !== 'none'
        && Math.abs(o.x - c.x) < innerWidth * 0.55);
      if (pool.length) target = pool[Math.floor(Math.random() * pool.length)];
    }
    if (target){
      const r = target.box.getBoundingClientRect();
      tx = r.left + r.width/2; ty = r.top + r.height*0.38;
    } else {
      tx = W*(0.2 + Math.random()*0.6);
      ty = H*(0.5 + Math.random()*0.3);
    }
    // 先转向目标再泼（transform 只能经 moveChar 写，直接覆写会把 translateX 冲掉 = 瞬移）
    c.dir = tx >= c.x ? 1 : -1;
    moveChar(c);
    // 泼的动作先起，水后出（0.18s 差）
    play(c, 'lunge', 760);
    setTimeout(() => {
      const T = spawnArc(from.x, from.y, tx, ty, target ? 32 : 24);
      const now = performance.now();
      if (now - lastNpcSfx > 2400){
        sfx(Math.random() < 0.5 ? 'ab_m' : 'ab_f', 0.45);
        lastNpcSfx = now;
      }
      if (target) setTimeout(() => { if (started) soak(target, c); }, T * 16);
      // 泼上瘾了会连泼 —— 泼水节得打起来才热闹
      const n = chain || 0;
      if (n < 2 && Math.random() < 0.42){
        setTimeout(() => { if (started && c.state === 'idle') throwWater(c, n + 1, target); },
                   520 + Math.random()*260);
      }
    }, 180);
  }

  /* 被 NPC 泼中：湿身记一笔 → 缩一下甩水 → 五成还手 → 旁观者看热闹 */
  function soak(t, from){
    t.wet = Math.min(4, (t.wet || 0) + 1);
    if (t.wet >= 2 && !t.box.classList.contains('soak')){
      t.box.classList.add('soak');
      clearTimeout(t.soakTmr);
      t.soakTmr = setTimeout(() => { t.box.classList.remove('soak'); t.wet = 0; }, 5200);
      // 湿透了：身上往下滴水
      const r = t.box.getBoundingClientRect();
      for (let i = 0; i < 7 && drops.length < MAX_DROPS; i++){
        drops.push({
          x: r.left + r.width * (0.2 + Math.random()*0.6),
          y: r.top + r.height * (0.25 + Math.random()*0.4),
          vx: (Math.random()-0.5)*0.5, vy: 0.6,
          r: 1 + Math.random()*1.6, life: .8,
          decay: 0.02 + Math.random()*0.015
        });
      }
    }
    react(t, 0.75);
    // 还手：直接朝着泼我的人泼回去 —— 这才是打水仗
    if (started && t.state === 'idle' && Math.random() < 0.5){
      setTimeout(() => { if (started && t.state === 'idle') throwWater(t, 0, from); },
                 320 + Math.random()*300);
    }
    // 旁观的人看热闹：凑过来笑
    if (Math.random() < 0.4){
      const crowd = CHARS.filter(o => o !== t && o !== from && o.box.style.display !== 'none'
        && o.state === 'idle' && Math.abs(o.x - t.x) < innerWidth * 0.35);
      if (crowd.length){
        const o = crowd[Math.floor(Math.random() * crowd.length)];
        setTimeout(() => { if (started && o.state === 'idle') play(o, 'laugh', 900); },
                   300 + Math.random()*400);
      }
    }
  }

  /* 对泼：两人你来我往打几个回合，最多 4 轮，打完有人大笑收场。
     决斗期间 duelLock 锁定双方 —— 调度器不许把他们调走，挨泼也不许开溜去舀水 */
  function exchange(a, b, round){
    if (!started) return;
    if (a.box.style.display === 'none' || b.box.style.display === 'none'){ a.duelLock = b.duelLock = false; return; }
    if (round >= 4 || Math.random() < 0.28){
      a.duelLock = b.duelLock = false;
      a.until = b.until = performance.now() + 1600;
      const winner = Math.random() < 0.5 ? a : b;
      const loser  = winner === a ? b : a;
      if (winner.state === 'idle') play(winner, 'laugh', 950);
      if (loser.state === 'idle')  play(loser, 'shake', 800);
      return;
    }
    a.duelLock = b.duelLock = true;
    const atk = round % 2 === 0 ? a : b;
    const dfd = atk === a ? b : a;
    // 面对面站好再出手
    atk.dir = dfd.x >= atk.x ? 1 : -1; moveChar(atk);
    dfd.dir = atk.x >= dfd.x ? 1 : -1; moveChar(dfd);
    atk.until = dfd.until = performance.now() + 1600;   // 站桩接招
    throwWater(atk, 0, dfd);
    setTimeout(() => exchange(a, b, round + 1), 950 + Math.random() * 400);
  }

  setInterval(() => {
    if (!started) return;
    const now = performance.now();
    for (const c of CHARS){
      if (c.box.style.display === 'none') continue;
      if (c.duelLock) continue;                 // 决斗锁：调度器不干预
      if (c.state !== 'idle' || now < c.until) continue;
      const r = Math.random();
      if (r < 0.28){
        c.state = 'walk';
        c.targetX = nudgeOffBasin(innerWidth * (0.08 + Math.random()*0.84), c);
      } else if (r < 0.70 && now - (c.nextAtk || 0) > 2400 && now - lastNpcAtk > 500){
        c.nextAtk = now + 3200 + Math.random()*3600;
        // 四成概率找人"对泼"：走到对方面前，你来我往 —— 这是广场，不是单人练习场
        const foes = CHARS.filter(o => o !== c && o.box.style.display !== 'none'
          && o.state === 'idle' && Math.abs(o.x - c.x) > innerWidth*0.16);
        if (foes.length && Math.random() < 0.62){
          const foe = foes[Math.floor(Math.random()*foes.length)];
          const gap = Math.max(70, innerWidth*0.17);
          const mid = (c.x + foe.x)/2;
          c.targetX = nudgeOffBasin(clampX(mid + gap/2 * (c.x <= foe.x ? -1 : 1), c), c);
          c.state = 'walk';
          c.duelFoe = foe;
        } else {
          c.basin = nearestBasin(c);
          const br = c.basin.getBoundingClientRect();
          const bx = br.left + br.width/2;
          const side = c.x <= bx ? -1 : 1;
          c.state = 'toBasin';
          c.targetX = clampX(bx + side*(br.width*0.5 + (c.w || c.box.offsetWidth)*0.12), c);
        }
        lastNpcAtk = now;
      } else if (r < 0.88){
        // 原地：甩水 / 仰头笑 / 蹦一下
        const rr = Math.random();
        if (rr < 0.40){ play(c, 'shake', 800); c.until = now + 1200 + Math.random()*2000; }
        else if (rr < 0.75){ play(c, 'laugh', 900); c.until = now + 1200 + Math.random()*2000; }
        else { play(c, 'hop', 520); c.until = now + 900 + Math.random()*1600; }
      } else {
        c.until = now + 1000 + Math.random()*1800;
      }
    }
  }, 240);

  /* ================= 起跑 ================= */
  layoutChars();
  resize();
  requestAnimationFrame(loop);
  setTimeout(shoot, 9000);
  scheduleLine();
  setTimeout(() => { for (const c of CHARS) placeChar(c); }, 1200);

})();
</script>
</body>
</html>
